# ---------------------------------------------------------------------------
# BICTR replication of NASA DRATS 2022 Site A (open plains), SP Crater AZ.
# Sources: /home/lunar5g/Desktop/BICTR_Data/DRATS/drats_2022_sites.csv, Wang 2025 thesis Tables 1-5.
#   gNB  35.616437 N -111.592136 E, 10 m mast (DRATS base tower)
#   UE   35.617634 N -111.581199 E, 2 m, 999 m from the tower, on a measured
#        1 arc-second cell of the eastbound drive leg (Wang 2025 thesis Fig. 18)
#   DRATS measured signal strength at the UE cell: -75.6 dBm
#        (cells 30-60 m either side along the road: -78.9 to -72.4 dBm;
#         read from the figure's colour scale, so about +-2 dB on top of that)
#   Terrain: SRTM1 (1 arc-second) .bdem, Earth radius 6378137 m
#   Soil: site A permittivity 6.847824 - 0.836473j (thesis Table 4), vertical pol.
#   Ring search: thesis "fast computation" preset (Table 5).
# NOTE: DRATS ran at 913 MHz / 20 MHz / 30 dBm. OAI's BICTR model is built with
#   center_freq = 0 and so uses a fixed 3.6192 GHz carrier for phases, reflector
#   losses and Doppler; this cannot be set from the config. The FIR is also
#   distance-normalised, so absolute path loss / RSSI is not reproduced.
# ---------------------------------------------------------------------------
rfsimulator :
{
  serveraddr = "127.0.0.1";
  serverport = "4043";
  options = ("chanmod");
  modelname = "AWGN";
  IQfile = "/tmp/rfsimulator.iqs";
};

channelmod = {
  max_chan   = 10;
  modellist = "modellist_bictr";
  modellist_bictr = (
    {
      model_name                  = "rfsimu_channel_enB0";
      type                        = "BICTR_LUNAR";
      ploss_dB                    = 0;
      noise_power_dB              = -16;
      forgetfact                  = 0;
      offset                      = 0;
      ds_tdl                      = 0;
      bictr_tx_rx_dist            = 998.7;
      bictr_tx_height             = 10.00;
      bictr_rx_height             = 2.00;
      bictr_ref_count             = 5;
      bictr_ring_radius_min       = 5.0;
      # Hao fast computation preset
      bictr_ring_radius_max       = 300.0;
      bictr_ring_radius_uncert    = 15.0;
      bictr_ring_count            = 10;
      bictr_ref_attempt_per_ring  = 3;
      bictr_permit_real           = 6.847824;
      bictr_permit_real_std       = 0.007099;
      bictr_permit_imag           = 0.836473;
      bictr_permit_imag_std       = 0.001295;
      bictr_horiz_pol             = 0;
      bictr_fading_paths          = 1024;
      bictr_doppler_spread        = 1.0;
      bictr_dem_file              = "/home/lunar5g/Desktop/BICTR_Data/DRATS/terrain/srtm1_sp_crater_drats.bdem";
      # Match gnb bictr: DEM tile 60S_30S_000_045
      bictr_tx_lon                = -111.592136;
      bictr_tx_lat                = 35.616437;
      bictr_rx_lon                = -111.581199;
      bictr_rx_lat                = 35.617634;
      bictr_body_radius           = 6378137.0;
    },
    {
      model_name                  = "rfsimu_channel_ue0";
      type                        = "BICTR_LUNAR";
      ploss_dB                    = 0;
      noise_power_dB              = -20;
      forgetfact                  = 0;
      offset                      = 0;
      ds_tdl                      = 0;
      bictr_tx_rx_dist            = 998.7;
      bictr_tx_height             = 2.00;
      bictr_rx_height             = 10.00;
      bictr_ref_count             = 5;
      bictr_ring_radius_min       = 5.0;
      # Hao fast computation preset
      bictr_ring_radius_max       = 300.0;
      bictr_ring_radius_uncert    = 15.0;
      bictr_ring_count            = 10;
      bictr_ref_attempt_per_ring  = 3;
      bictr_permit_real           = 6.847824;
      bictr_permit_real_std       = 0.007099;
      bictr_permit_imag           = 0.836473;
      bictr_permit_imag_std       = 0.001295;
      bictr_horiz_pol             = 0;
      bictr_fading_paths          = 1024;
      bictr_doppler_spread        = 1.0;
      bictr_dem_file              = "/home/lunar5g/Desktop/BICTR_Data/DRATS/terrain/srtm1_sp_crater_drats.bdem";
      bictr_tx_lon                = -111.581199;
      bictr_tx_lat                = 35.617634;
      bictr_rx_lon                = -111.592136;
      bictr_rx_lat                = 35.616437;
      bictr_body_radius           = 6378137.0;
    }
  );
};

log_config :
{
  global_log_level = "info";
  hw_log_level     = "info";
  phy_log_level    = "info";
  mac_log_level    = "info";
  rlc_log_level    = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
};
